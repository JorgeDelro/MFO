url: https://jorgedelro.github.io/MFO/
destination: pkgdown-site
template:
  bootstrap: 5

# Home page: README.md (pkgdown's default)

navbar:
  structure:
    left: [intro, reference, articles, news]
  components:
    intro:
      text: Get started
      href: articles/mfo-workflow.html

articles:
- title: Workflow
  navbar: ~
  contents:
  - mfo-workflow
- title: Bayesian fit
  navbar: Bayesian fit
  contents:
  - bayes
- title: Validation
  navbar: Validation
  contents:
  - validation

reference:
- title: Import data
  desc: >
    Read a metabolic cart export into the tables that `MFO()` expects
    (internal data contract, 10-s averages).
  contents:
  - read_cart
- title: Describe the test
  desc: >
    Protocol of the MFO test (step durations, averaged segment, load and
    exercise mode) and VO2max of the graded test with maximality criteria.
  contents:
  - MFO_protocol
  - VO2max_from_test
- title: Compute MFO and Fatmax
  desc: >
    One participant: basal window, step averaging, stoichiometric equation,
    curve fit (P3, P2, MV, MRER), Fatmax zone and crossover point.
  contents:
  - MFO
- title: Kinetics
  desc: SIN model of fat oxidation kinetics (Chenevière et al., 2009).
  contents:
  - MFO_kinetics
- title: Batch
  desc: Many participants from a folder of xlsx files.
  contents:
  - MFOs
- title: Bayesian fit
  desc: >
    Bayesian SIN (or P3) with brms on Stan, parametrised by MFO, Fatmax,
    Fatmin and s; prior predictive check.
  contents:
  - MFO_bayes
  - MFO_prior_check
- title: Reliability
  desc: >
    Test-retest reliability of a lab: ICC(2,1), SEM, MDC, CV, bias and
    limits of agreement (Bland-Altman plots).
  contents:
  - MFO_reliability
  - plot.MFO_reliability
- title: Simulate
  desc: >
    Synthetic repeated tests with a known truth, for reliability and
    uncertainty studies and demonstrations.
  contents:
  - simulate_MFO_sessions
  - write_MFO_sessions
- title: Datasets
  desc: Anonymised example recordings of one participant (20-s averages).
  contents:
  - basal_df
  - MFO_df
  - VO2max_df
- title: Internal helpers
  desc: >
    Not exported; documented so that every step of `MFO()` can be traced.
    Their arguments may change without notice.
  contents:
  - read_MFO_databases
  - preprocess_bxb
  - met_basal
  - calculate_vars
  - substrate_oxidation
  - fat_oxidation_MRER
