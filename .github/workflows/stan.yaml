# Bayesian tests of MFO_bayes() (Stan). Separate from R-CMD-check because
# brms compiles a Stan model per test (about a minute each). Runs when the
# Bayesian code, its tests or this workflow change, weekly, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'R/MFO_bayes*'
      - 'tests/testthat/test-MFO_bayes*'
      - '.github/workflows/stan.yaml'
  pull_request:
    paths:
      - 'R/MFO_bayes*'
      - 'tests/testthat/test-MFO_bayes*'
      - '.github/workflows/stan.yaml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

name: stan.yaml

permissions: read-all

jobs:
  stan-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MFO_STAN_TESTS: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::brms, any::rstan, any::devtools
          needs: check

      - name: Run the Bayesian tests
        run: |
          options(mc.cores = 2)
          devtools::test(filter = "MFO_bayes", stop_on_failure = TRUE)
        shell: Rscript {0}
